<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — Queens Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/staff/css/staff.css">
</head>
<body>
<div class="center-wrap">
  <div class="card">
    <h1>Staff Login</h1>
    <p class="sub">Queens Hospital — counter console</p>

    <div class="error-banner hidden" id="login-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="employee_code">Employee code</label>
        <input type="text" id="employee_code" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
  </div>
</div>

<script src="/staff/js/common.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('login-error');
  errorBox.classList.add('hidden');

  const employee_code = document.getElementById('employee_code').value.trim();
  const password = document.getElementById('password').value;

  try {
    await api('/api/staff/login', {
      method: 'POST',
      body: JSON.stringify({ employee_code, password })
    });
    window.location.href = '/staff/select-counter.html';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove('hidden');
  }
});
</script>
</body>
</html>
