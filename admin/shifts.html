<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shifts — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Your Opinion</div>
    <nav id="sidebar-nav"></nav>
    <a href="#" class="logout-link" id="logout-btn">Log out</a>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1>Shifts</h1>
        <p>Define named shifts with start/end times — used when building the roster</p>
      </div>
    </div>

    <div class="panel" style="padding: 18px 20px; margin-bottom: 20px;">
      <div class="error-banner hidden" id="form-error"></div>
      <form id="shift-form" class="form-row">
        <div class="field">
          <label for="shift_name">Shift name</label>
          <input type="text" id="shift_name" placeholder="e.g. Morning" required>
        </div>
        <div class="field">
          <label for="start_time">Start time</label>
          <input type="time" id="start_time" required>
        </div>
        <div class="field">
          <label for="end_time">End time</label>
          <input type="time" id="end_time" required>
        </div>
        <div class="field">
          <label for="shift_code">Shift code (optional)</label>
          <input type="text" id="shift_code" placeholder="e.g. G" maxlength="10">
        </div>
        <button type="submit" class="btn btn-primary">Add Shift</button>
      </form>
      <p class="muted" style="margin: 8px 0 0; font-size: 12.5px;">
        Set a short code (like G, M, E, N) to match this shift up automatically when importing a roster from Excel.
      </p>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr><th>Name</th><th>Code</th><th>Start</th><th>End</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="shifts-tbody">
          <tr><td colspan="6" class="muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="/admin/js/common.js"></script>
<script src="/admin/js/shifts.js"></script>
</body>
</html>
